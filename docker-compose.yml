services:
  web:
    build: .
    container_name: challenge-flask-app
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - chromadb
    command: python src/app.py

  ingestor:
    build: .
    container_name: challenge-ingestor
    env_file:
      - .env
    depends_on:
      - chromadb
    command: python src/ingestor_command.py

  chromadb:
    image: chromadb/chroma:latest
    container_name: challenge-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma

volumes:
  chroma_data:
