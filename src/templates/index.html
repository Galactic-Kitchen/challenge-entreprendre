<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG Assistant</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-soft: #1f2937;
        --input: #0b1220;
        --border: rgba(148, 163, 184, 0.2);
        --text: #e5e7eb;
        --muted: #94a3b8;
        --user: #2563eb;
        --assistant: #1f2937;
        --accent: #22c55e;
        --danger: #ef4444;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, #111827 45%, #0f172a);
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .chat-shell {
        width: min(720px, 100%);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.45);
        overflow: hidden;
      }

      .chat-header {
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.9);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .chat-messages {
        height: 420px;
        overflow-y: auto;
        padding: 20px;
        background: rgba(2, 6, 23, 0.25);
      }

      .message {
        display: flex;
        margin-bottom: 16px;
      }

      .message.user { justify-content: flex-end; }

      .message.assistant { justify-content: flex-start; }

      .bubble {
        max-width: 80%;
        padding: 12px 14px;
        border-radius: 18px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .message.user .bubble {
        background: var(--user);
        border-bottom-right-radius: 6px;
      }

      .message.assistant .bubble {
        background: var(--assistant);
        border: 1px solid var(--border);
        border-bottom-left-radius: 6px;
      }

      .sources {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--muted);
        font-size: 0.85rem;
      }

      .sources ul {
        margin: 8px 0 0 18px;
        padding: 0;
      }

      .chat-form {
        padding: 18px 20px 20px;
        border-top: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.8);
      }

      .chat-form textarea {
        width: 100%;
        min-height: 100px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        background: var(--input);
        color: var(--text);
        font: inherit;
      }

      .chat-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
      }

      .hint {
        font-size: 0.8rem;
        color: var(--muted);
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        background: var(--accent);
        color: #052e16;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .status {
        min-height: 20px;
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="chat-shell">
      <div class="chat-header">RAG Assistant</div>

      <div id="chat-messages" class="chat-messages" aria-live="polite">
        <div class="message assistant">
          <div class="bubble">Ask a question to search the knowledge base.</div>
        </div>
      </div>

      <form id="chat-form" class="chat-form" novalidate>
        <textarea
          id="question-input"
          name="question"
          placeholder="Type your question here..."
          required
        ></textarea>

        <div class="chat-actions">
          <span class="hint">Each new question is processed independently.</span>
          <button id="submit-button" type="submit">Ask</button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
      </form>
    </div>

    <script>
      const messagesEl = document.getElementById('chat-messages');
      const form = document.getElementById('chat-form');
      const input = document.getElementById('question-input');
      const statusEl = document.getElementById('status');
      const submitButton = document.getElementById('submit-button');

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function addMessage(role, text, sources = []) {
        const wrapper = document.createElement('div');
        wrapper.className = `message ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        wrapper.appendChild(bubble);

        if (Array.isArray(sources) && sources.length) {
          const sourceBlock = document.createElement('div');
          sourceBlock.className = 'sources';
          sourceBlock.innerHTML = '<strong>Sources</strong><ul></ul>';

          sources.forEach((source) => {
            const item = document.createElement('li');
            const sourceText = source && source.text ? source.text : 'Source';
            item.textContent = sourceText.length > 180 ? `${sourceText.slice(0, 180)}...` : sourceText;
            sourceBlock.querySelector('ul').appendChild(item);
          });

          wrapper.appendChild(sourceBlock);
        }

        messagesEl.appendChild(wrapper);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();

        const question = input.value.trim();
        if (!question) {
          input.focus();
          return;
        }

        addMessage('user', question);
        input.value = '';
        setStatus('Searching...');
        submitButton.disabled = true;
        submitButton.textContent = 'Thinking...';

        try {
          const response = await fetch('/api/rag/query', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ question })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data && data.error ? data.error : 'Something went wrong while contacting the backend.');
          }

          const answer = data.answer || 'No answer was returned.';
          addMessage('assistant', answer, Array.isArray(data.sources) ? data.sources : []);
          setStatus('Ready for another question.');
        } catch (error) {
          addMessage('assistant', error.message || 'Request failed.');
          setStatus('Request failed.');
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = 'Ask';
          input.focus();
        }
      });
    </script>
  </body>
</html>
